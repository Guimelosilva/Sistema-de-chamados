<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Chamados TI - Dashboard</title>
    <link rel="stylesheet" href="estilo.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-ticket-alt"></i>
                <h2>Chamados TI</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" data-page="dashboard" class="nav-item active">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="#" data-page="chamados" class="nav-item" id="menuChamados">
                    <i class="fas fa-list"></i> Chamados
                </a>
                <a href="#" data-page="novo-chamado" class="nav-item" id="menuNovoChamado">
                    <i class="fas fa-plus-circle"></i> Novo Chamado
                </a>
                <a href="#" data-page="usuarios" class="nav-item" id="menuUsuarios">
                    <i class="fas fa-users"></i> Usuários
                </a>
                <a href="#" data-page="relatorios" class="nav-item" id="menuRelatorios">
                    <i class="fas fa-chart-pie"></i> Relatórios
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info" id="userInfo">
                    <i class="fas fa-user-circle"></i>
                    <span id="userName"></span>
                </div>
                <button id="btnLogout" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="top-bar">
                <button id="btnMenuToggle" class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 id="pageTitle">Dashboard</h1>
                <div class="top-bar-right">
                    <span id="userRoleBadge" class="role-badge"></span>
                </div>
            </header>
            
            <div id="pageContent" class="page-content"></div>
        </main>
    </div>
    
    <div id="modalChamado" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Detalhes do Chamado</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>
    
    <div id="modalUsuario" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalUsuarioTitle">Cadastrar Usuário</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="formUsuario">
                    <input type="hidden" id="usuarioId">
                    <div class="form-group">
                        <label>Nome Completo *</label>
                        <input type="text" id="usuarioNome" required>
                    </div>
                    <div class="form-group">
                        <label>E-mail *</label>
                        <input type="email" id="usuarioEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Ramal / Telefone</label>
                        <input type="text" id="usuarioRamal">
                    </div>
                    <div class="form-group">
                        <label>Setor</label>
                        <input type="text" id="usuarioSetor">
                    </div>
                    <div class="form-group">
                        <label>Login (Usuário) *</label>
                        <input type="text" id="usuarioLogin" required>
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="usuarioSenha" placeholder="Deixe em branco para manter a atual">
                        <small>Para novo usuário, a senha é obrigatória</small>
                    </div>
                    <div class="form-group">
                        <label>Tipo de Usuário *</label>
                        <select id="usuarioTipo" required>
                            <option value="comum">Usuário Comum (Abrir chamados)</option>
                            <option value="ti">Equipe TI (Atender chamados)</option>
                            <option value="admin">Administrador (Acesso total)</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary modal-close">Cancelar</button>
                <button class="btn-primary" id="btnSalvarUsuario">Salvar</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
