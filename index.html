<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Chamados TI - Login</title>
    <link rel="stylesheet" href="estilo.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-ticket-alt"></i>
                <h1>Sistema de Chamados TI</h1>
                <p>Suporte | Sistema | Telefonia</p>
            </div>
            
            <div class="login-tabs">
                <button class="tab-btn active" data-tab="login">Entrar</button>
                <button class="tab-btn" data-tab="cadastro">Criar Conta</button>
            </div>
            
            <form id="loginForm" class="tab-pane active">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="loginUsuario" placeholder="Usuário" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginSenha" placeholder="Senha" required>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>
            
            <form id="cadastroForm" class="tab-pane">
                <div class="form-row-login">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="cadastroNome" placeholder="Nome completo" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="cadastroEmail" placeholder="E-mail" required>
                    </div>
                </div>
                <div class="form-row-login">
                    <div class="input-group">
                        <i class="fas fa-phone"></i>
                        <input type="text" id="cadastroRamal" placeholder="Ramal / Telefone" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-building"></i>
                        <input type="text" id="cadastroSetor" placeholder="Setor" required>
                    </div>
                </div>
                <div class="info-box-login">
                    <i class="fas fa-info-circle"></i> O e-mail informado será usado como login para acessar o sistema.
                </div>
                <div class="form-row-login">
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="cadastroSenha" placeholder="Senha" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="cadastroConfirmarSenha" placeholder="Confirmar senha" required>
                    </div>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-user-plus"></i> Criar Conta
                </button>
            </form>
            
            <div id="loginError" class="login-error"></div>
            
            <div class="login-footer">
                <p>Desenvolvido para equipe de TI</p>
                <p class="cpd-ti">CPD / TI 828524</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
